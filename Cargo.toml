[package]
name = "PhysicsSim"
version = "0.2.0"
edition = "2024"
authors = ["SammmE"]
description = "Advanced 2D physics simulation with real-time particle tracking and graphing"
license = "MIT"
repository = "https://github.com/SammmE/PhysicsSim"
keywords = ["physics", "simulation", "particles", "graphics"]
categories = ["science", "simulation", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
wgpu = "0.20"
winit = "0.29"
egui = { version = "0.28", default-features = false, features = ["default_fonts"] }
egui-wgpu = "0.28"
egui-winit = { version = "0.28", default-features = false, features = ["links", "wayland", "x11"] }
egui_plot = "0.28"
bytemuck = { version = "1.16", features = ["derive"] }
rand = "0.8"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"
env_logger = "0.11"
rfd = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
