[package]
name = "PhysicsSim"
version = "0.2.0"
edition = "2024"
authors = ["SammmE"]
description = "Advanced 2D physics simulation with real-time particle tracking and graphing"
license = "MIT"
repository = "https://github.com/SammmE/PhysicsSim"
keywords = ["physics", "simulation", "particles", "graphics"]
categories = ["science", "simulation", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
egui = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
] }
egui-wgpu = { version = "0.33.3", default-features = false }
egui-winit = { version = "0.33.3", default-features = false, features = [
    "links",
    "wayland",
    "x11",
] }
egui_plot = "0.34.0"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
log = "0.4.29"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
web-time = "1.1.0"
wgpu = "27.0.1"
winit = "0.30.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"
env_logger = "0.11.8"
rfd = "0.17.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
